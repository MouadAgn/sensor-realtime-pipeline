# =============================================================================
#  Socle infra — Pipeline Kappa : Kafka -> Spark (Delta) -> Postgres -> Metabase
#  Lot « Infra & ingestion ». Les jobs Spark des collègues se branchent dessus.
#
#  Démarrage infra :   docker compose up -d --build
#  Générateur     :   docker compose --profile generator up -d generator
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # KAFKA (KRaft, mono-nœud — pas de Zookeeper, léger pour laptop 16 Go)
  #   - kafka:9092         => bus interne (spark, generator, kafka-ui)
  #   - localhost:29092    => accès depuis l'hôte
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # ---------------------------------------------------------------------------
  # KAFKA-INIT (one-shot) : crée le topic `sensors-data` puis s'arrête
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Création du topic ${KAFKA_TOPIC:-sensors-data}…"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic ${KAFKA_TOPIC:-sensors-data} \
          --partitions ${KAFKA_PARTITIONS:-3} \
          --replication-factor 1
        echo "----- Description du topic -----"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
          --describe --topic ${KAFKA_TOPIC:-sensors-data}

  # ---------------------------------------------------------------------------
  # KAFKA-UI : inspection du topic / messages (preuves d'ingestion)
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ---------------------------------------------------------------------------
  # SPARK MASTER (les collègues soumettent leurs jobs ici via spark-submit)
  # ---------------------------------------------------------------------------
  spark-master:
    build: ./spark
    image: sensor-spark:3.5.3
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "${SPARK_MASTER_UI_PORT:-8081}:8080"   # Web UI master
      - "${SPARK_MASTER_PORT:-7077}:7077"      # spark://
      - "${SPARK_APP_UI_PORT:-4040}:4040"      # UI du job (driver)
    volumes:
      - ./spark/apps:/opt/spark-apps                 # jobs des collègues
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro                          # référentiel CSV
      - ./lakehouse:/opt/lakehouse                   # tables Delta Bronze/Silver/Gold
      - ./checkpoints:/opt/checkpoints               # checkpoints streaming

  # ---------------------------------------------------------------------------
  # SPARK WORKER (exécuteurs)
  # ---------------------------------------------------------------------------
  spark-worker:
    build: ./spark
    image: sensor-spark:3.5.3
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command: ["org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "${SPARK_WORKER_CORES:-4}", "--memory", "${SPARK_WORKER_MEMORY:-4G}", "--webui-port", "8081"]
    ports:
      - "${SPARK_WORKER_UI_PORT:-8082}:8081"   # Web UI worker
    volumes:
      - ./spark/apps:/opt/spark-apps
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./data:/opt/data:ro
      - ./lakehouse:/opt/lakehouse
      - ./checkpoints:/opt/checkpoints

  # ---------------------------------------------------------------------------
  # POSTGRES : serving layer lu par Metabase (le job Gold y recopie le star-schema)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warehouse}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warehouse} -d ${POSTGRES_DB:-warehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # METABASE : dashboard BI (se connecte à Postgres `warehouse`, schéma `gold`)
  # ---------------------------------------------------------------------------
  metabase:
    image: metabase/metabase:v0.50.26
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data

  # ---------------------------------------------------------------------------
  # GÉNÉRATEUR (profil `generator` : ne démarre pas avec `up` par défaut)
  #   docker compose --profile generator up -d generator
  # ---------------------------------------------------------------------------
  generator:
    build: ./generator
    image: sensor-generator:latest
    profiles: ["generator"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: ${KAFKA_TOPIC:-sensors-data}
      ANOMALY_RATE: ${ANOMALY_RATE:-0.05}
      MIN_INTERVAL: ${MIN_INTERVAL:-1}
      MAX_INTERVAL: ${MAX_INTERVAL:-3}
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  metabase-data:
