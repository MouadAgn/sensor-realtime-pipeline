# Config Spark partagée (montée dans spark-master & spark-worker).
# Les jobs des collègues héritent automatiquement de ces réglages.

# --- Cluster ---
spark.master                         spark://spark-master:7077

# --- Delta Lake (extensions + catalog) ---
spark.sql.extensions                 io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog      org.apache.spark.sql.delta.catalog.DeltaCatalog

# Entrepôt Delta (bind-mount ./lakehouse). Les tables Bronze/Silver/Gold vivent ici.
spark.sql.warehouse.dir              /opt/lakehouse/warehouse

# --- Réglages laptop 16 Go : peu de partitions de shuffle ---
spark.sql.shuffle.partitions         4
spark.default.parallelism            4
spark.serializer                     org.apache.spark.serializer.KryoSerializer

# --- Mémoire (driver dans spark-master, executor dans spark-worker 3g) ---
spark.driver.memory                  1g
spark.executor.memory                2g
spark.executor.cores                 2

# Fuseau des timestamps
spark.sql.session.timeZone           Europe/Paris
